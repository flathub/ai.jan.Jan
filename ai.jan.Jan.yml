id: ai.jan.Jan
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: Jan
finish-args:
  - --socket=wayland # Permission needed to show the window
  - --socket=fallback-x11 # Permission needed to show the window on X11
  # GPU access for the in-process llama.cpp engine. --device=dri also binds
  # /dev/nvidia*, and libcuda.so.1 comes from the host-matched
  # org.freedesktop.Platform.GL.nvidia-* extension on the default ld path.
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio # for future multimodality
  # System tray (tray-icon dlopens libayatana-appindicator3, bundled below)
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/cmake
  - '*.a'

modules:
  # The GNOME runtime/SDK does not ship libayatana-appindicator, which the
  # Tauri tray icon loads at runtime. Build it and its dependency chain.
  # intltool was dropped from the SDK; libdbusmenu's autotools build needs it.
  - name: intltool
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

  - name: libayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TESTS=NO
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38

  - name: libdbusmenu-gtk3
    buildsystem: autotools
    build-options:
      cflags: -Wno-error
    config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-nls
      - --disable-introspection
      - --disable-vala
      - --disable-gtk-doc
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TESTS=NO
      - -DENABLE_IDO=YES
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.4.tar.gz
        sha256: a18d3c682e29afd77db24366f8475b26bda22b0e16ff569a2ec71cd6eb4eac95

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BINDINGS_MONO=NO
      - -DENABLE_BINDINGS_VALA=NO
      - -DENABLE_INTROSPECTION=NO
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DENABLE_GTKDOC=NO
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.5.93.tar.gz
        sha256: cbefed7a918a227bf71286246e237fcd3a9c8499b3eaac4897811a869409edf0

  # ggml-vulkan needs `find_package(SPIRV-Headers CONFIG)`; the SDK ships
  # glslc, glslang and the Vulkan headers/loader, but not this cmake config.
  - name: spirv-headers
    buildsystem: cmake-ninja
    builddir: true
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.357.0.tar.gz
        sha256: 4d703067a7e06331ccb37bdfed3f9b7879cc61969a2689ae95c95db34a47ff07

  # Build-only CUDA toolkit from NVIDIA's per-component redist archives (no
  # SDK extension exists). The whole tree is cleaned up; the engine staging
  # step copies only the redistributable runtime (cudart, cublas, cublasLt,
  # EULA Attachment A) beside the worker. 13.2+ is required: earlier 13.x
  # headers clash with the SDK's glibc on rsqrt/rsqrtf.
  - name: cuda-toolkit
    buildsystem: simple
    only-arches: [x86_64]
    cleanup:
      - /cuda
    build-commands:
      - mkdir -p /app/cuda
      - for d in nvcc crt nvvm cudart cccl cublas; do cp -a $d/. /app/cuda/; done
      # nvcc resolves -lcudadevrt via <nvcc>/../lib64; the archives ship lib
      - ln -s lib /app/cuda/lib64
      - install -Dm644 cudart/LICENSE /app/share/licenses/ai.jan.Jan/CUDA-LICENSE.txt
    sources:
      - type: archive
        url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-13.4.92-archive.tar.xz
        sha256: 60998f40cc9df5826b2a846e2dcc328133fbc5ef539398ce0a21cf5dcac7193d
        dest: nvcc
      - type: archive
        url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_crt/linux-x86_64/cuda_crt-linux-x86_64-13.4.92-archive.tar.xz
        sha256: c969e61ded12dbf0cf20ace72867f1622ec0e8ea1e1d305e27761012025f7aaa
        dest: crt
      - type: archive
        url: https://developer.download.nvidia.com/compute/cuda/redist/libnvvm/linux-x86_64/libnvvm-linux-x86_64-13.4.92-archive.tar.xz
        sha256: 0e619cf3d5b27f7c812665599ca9761fc296e56129b24a85d822a5d8a1a3bd75
        dest: nvvm
      - type: archive
        url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-13.4.92-archive.tar.xz
        sha256: 0ac5dbc538d04e9983bc493b410cce4b459e1ee9f5f6654b6464ef7b3e14a8b5
        dest: cudart
      - type: archive
        url: https://developer.download.nvidia.com/compute/cuda/redist/cccl/linux-x86_64/cccl-linux-x86_64-13.3.4.3.1-archive.tar.xz
        sha256: 6b7516074f42f80dd3feb9c11318c8e1c5ab56cdd9f18fff4c5ace2e7e0a8209
        dest: cccl
      - type: archive
        url: https://developer.download.nvidia.com/compute/cuda/redist/libcublas/linux-x86_64/libcublas-linux-x86_64-13.8.0.4-archive.tar.xz
        sha256: bd6ffcce561672da6abb928214a6694f392741e7d1e2d7dfde0da4bd651706b6
        dest: cublas

  - name: jan
    buildsystem: simple
    only-arches: [x86_64]
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin:/app/cuda/bin
      env:
        CARGO_NET_OFFLINE: 'true'
        SKIP_BINARIES: '1'
        RELEASE_CHANNEL: stable
        AUTO_UPDATER_DISABLED: 'true'
        YARN_ENABLE_TELEMETRY: '0'
        YARN_ENABLE_GLOBAL_CACHE: 'false'
        # Engine: CUDA 13 + Vulkan, the same variant as the nightly linux build
        CUDA_PATH: /app/cuda
        CUDA_HOME: /app/cuda
        JAN_ENGINE_FEATURES: engine-cuda,engine-vulkan
    sources:
      - type: archive
        url: https://github.com/janhq/jan/archive/refs/tags/v0.8.8.tar.gz
        sha256: 0f88916c38acf78c794b430b3c46729ec42e2617cfeba12644b664e1bdd1c35f
      # Vendors src-tauri/Cargo.lock and the llamacpp plugin's own lockfile;
      # its .cargo/config.toml covers every crate built under src-tauri
      - type: archive
        url: https://github.com/janhq/jan/releases/download/v0.8.8/jan-cargo-vendor-v0.8.8.tar.gz
        sha256: 901c3d2cc078ef511639d74ae35a632dcf5ebab45f5ef7a0cc6b360e7a72849a
        dest: src-tauri
        strip-components: 0
      - type: archive
        url: https://github.com/janhq/jan/releases/download/v0.8.8/jan-yarn-cache-v0.8.8.tar.gz
        sha256: 35239a6c76972709e8dc3e6eecd4c038fe88d31a5d8baaf6a5fa43ba91ffee21
        strip-components: 0
      # llama.cpp at the pin in src-tauri/plugins/tauri-plugin-llamacpp/build.rs
      # (PINNED_TAG / PINNED_COMMIT), where build.rs looks for it by default;
      # this replaces the network clone in fetch-engine-source.sh
      - type: archive
        url: https://github.com/ggml-org/llama.cpp/archive/refs/tags/b11669.tar.gz
        sha256: e06ba4fa263e30fdb9f0e65f00a8965202ddaa0c51f548a67e1f9b2164d04efc
        dest: src-tauri/plugins/tauri-plugin-llamacpp/vendor/llama.cpp
      - type: file
        url: https://repo.yarnpkg.com/4.5.3/packages/yarnpkg-cli/bin/yarn.js
        sha256: dddc0b96ad2dca8d56a5302b56bf3cbf8210654474a6bf88877da61e866f3d46
        dest: .yarn/releases
        dest-filename: yarn-4.5.3.cjs
      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip
        sha256: 951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f
        dest: prebuilt/bun
        strip-components: 1
      - type: archive
        url: https://github.com/astral-sh/uv/releases/download/0.11.31/uv-x86_64-unknown-linux-gnu.tar.gz
        sha256: 8cc1cd82d434ec565376f98bd938d4b715b5791a80ff2d3aa78821cf85091b4b
        dest: prebuilt/uv
        strip-components: 1
      - type: file
        path: ai.jan.Jan.metainfo.xml
      - type: file
        path: ai.jan.Jan.desktop
    build-commands:
      # Offline binaries normally fetched by scripts/download-bin.mjs (SKIP_BINARIES=1)
      - install -Dm755 prebuilt/bun/bun src-tauri/resources/bin/bun
      - install -Dm755 prebuilt/uv/uv src-tauri/resources/bin/uv
      - install -Dm755 prebuilt/uv/uv src-tauri/resources/bin/uv-x86_64-unknown-linux-gnu
      # Pin yarn to the vendored release; nested `yarn` calls in scripts resolve
      # via yarn's own PATH injection, bypassing the corepack shim entirely
      - echo "yarnPath: .yarn/releases/yarn-4.5.3.cjs" >> .yarnrc.yml
      # Offline installs from the vendored yarn cache (root + plugins are
      # two separate yarn projects); YARN_ENABLE_GLOBAL_CACHE=false points
      # yarn at each project's .yarn/cache
      - node .yarn/releases/yarn-4.5.3.cjs install
      - cd src-tauri/plugins && node "$FLATPAK_BUILDER_BUILDDIR/.yarn/releases/yarn-4.5.3.cjs" install
      # Stamp release version into web-app/package.json (source tag ships it
      # stale; the UI's VERSION is injected from here at build time)
      - node -e "const f='web-app/package.json',p=require('./'+f);p.version='0.8.8';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      # Build TS layers
      - node .yarn/releases/yarn-4.5.3.cjs build:tauri:plugin:api
      - node .yarn/releases/yarn-4.5.3.cjs build:core
      - node .yarn/releases/yarn-4.5.3.cjs build:extensions
      # Generate sized app icons (git-ignored; tauri macro needs them) + stage LICENSE
      - node .yarn/releases/yarn-4.5.3.cjs build:icon
      - node .yarn/releases/yarn-4.5.3.cjs copy:assets:tauri
      # llama.cpp engine worker + ggml backend modules (+ CUDA runtime), the
      # offline equivalent of `make build-engine`. It is built from the plugin
      # crate alone (the app crate forwards no engine feature) and must be
      # staged before `tauri build`: tauri.linux.conf.json lists the staged
      # files as bundle resources and generate_context!() fails without them.
      - bash src-tauri/build-utils/check-engine-toolchain.sh cuda13-vulkan "$JAN_ENGINE_FEATURES"
      - cd src-tauri/plugins/tauri-plugin-llamacpp && cargo build --release --locked --features "$JAN_ENGINE_FEATURES" --bin jan-llama-worker
      - bash src-tauri/build-utils/stage-engine.sh release
      - src-tauri/resources/bin/jan-llama-worker --version
      # Main app binary (frontend built via beforeBuildCommand)
      - node .yarn/releases/yarn-4.5.3.cjs tauri build --no-bundle
      # Install app: binary, sidecars, resources (tauri resource_dir =
      # <exe>/../lib/<productName>, i.e. /app/lib/Jan)
      - install -Dm755 src-tauri/target/release/Jan-Desktop /app/bin/Jan
      - install -Dm755 src-tauri/resources/bin/bun /app/bin/bun
      - install -Dm755 src-tauri/resources/bin/uv /app/bin/uv
      - install -Dm644 src-tauri/resources/LICENSE /app/lib/Jan/resources/LICENSE
      # Worker, ggml modules and CUDA runtime must share one directory (ggml
      # scans the worker's dir; everything resolves via $ORIGIN). cp -P keeps
      # the soname symlink chains as links.
      - install -Dm755 src-tauri/resources/bin/jan-llama-worker /app/lib/Jan/resources/bin/jan-llama-worker
      - cp -P src-tauri/resources/bin/lib*.so* /app/lib/Jan/resources/bin/
      # Desktop entry, icons, appstream metadata
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/ai.jan.Jan.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/ai.jan.Jan.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256@2/apps/ai.jan.Jan.png
      - install -Dm644 ai.jan.Jan.desktop /app/share/applications/ai.jan.Jan.desktop
      - install -Dm644 ai.jan.Jan.metainfo.xml /app/share/metainfo/ai.jan.Jan.metainfo.xml
